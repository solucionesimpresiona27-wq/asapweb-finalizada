      <script>
        (function () {
          // Tiempo local: 0 = 7.85 s del video
          const tl = gsap.timeline({ paused: true });
          const IN = 0.15; // 8.0 s

          tl.fromTo("#s3-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, IN);
          gsap.utils.toArray("#s3-title .s3-line").forEach((el, i) => {
            tl.fromTo(el, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "power4.out" }, IN + 0.1 + i * 0.14);
          });
          tl.fromTo(
            "#s3-panel",
            { opacity: 0, y: 160, scale: 0.92, rotationX: 16, transformPerspective: 1800 },
            { opacity: 1, y: 0, scale: 1, rotationX: 0, transformPerspective: 1800, duration: 0.85, ease: "expo.out" },
            IN + 0.2,
          );

          // Mensaje del cliente
          const pop = (sel, t) =>
            tl.fromTo(sel, { opacity: 0, scale: 0.6, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.8)" }, t);
          pop("#s3-m1", 0.85);

          // "Escribiendo…" con los tres puntos rebotando
          const typing = (sel, from, to) => {
            tl.fromTo(sel, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, from);
            gsap.utils.toArray(sel + " i").forEach((dot, k) => {
              tl.fromTo(dot, { y: 0 }, { y: -12, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, from + 0.1 + k * 0.09);
            });
            tl.to(sel, { opacity: 0, scale: 0.8, duration: 0.12, ease: "power2.in" }, to);
          };
          typing("#s3-t1", 1.25, 1.95);
          pop("#s3-m2", 2.05);
          gsap.utils.toArray(".s3-chip").forEach((c, k) => {
            tl.fromTo(c, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 2.5 + k * 0.12);
          });

          // El cliente toca "4:30 p. m."
          const TAP = 3.3; // 11.15 s
          tl.fromTo("#s3-chip-b", { scale: 1 }, { scale: 0.9, duration: 0.08, ease: "power2.in", immediateRender: false }, TAP);
          tl.to("#s3-chip-b", { scale: 1, duration: 0.35, ease: "back.out(3)" }, TAP + 0.08);
          tl.fromTo("#s3-chip-b-fill", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, TAP);
          tl.fromTo("#s3-chip-b-text", { color: "#fcc204" }, { color: "#060c1c", duration: 0.12, ease: "power1.out" }, TAP);
          pop("#s3-m3", 3.55);

          typing("#s3-t2", 3.95, 4.55);
          pop("#s3-m4", 4.65);
          // La conversación sube para dejar ver la tarjeta de la cita
          tl.fromTo("#s3-list", { y: 0 }, { y: -170, duration: 0.55, ease: "power3.inOut" }, 4.75);
          tl.to("#s3-m1", { opacity: 0, duration: 0.3, ease: "power1.in" }, 4.75);
          tl.fromTo("#s3-card", { opacity: 0, scale: 0.7, x: -30 }, { opacity: 1, scale: 1, x: 0, duration: 0.55, ease: "back.out(1.6)" }, 4.95);
          tl.fromTo("#s3-tick", { strokeDashoffset: 44 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 5.2);
          tl.fromTo("#s3-card-ok", { scale: 0.5 }, { scale: 1, duration: 0.45, ease: "back.out(3)" }, 5.15);

          // Sello 24/7
          tl.fromTo(
            "#s3-stamp",
            { opacity: 0, scale: 2.2, rotation: -40 },
            { opacity: 1, scale: 1, rotation: -12, duration: 0.42, ease: "power4.out" },
            5.85,
          );
          tl.to("#s3-stamp", { scale: 1.06, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.4);

          // Salida: barrido hacia arriba con desenfoque
          tl.to("#s3-stage", { y: -260, opacity: 0, filter: "blur(22px)", duration: 0.36, ease: "power3.in" }, 7.84);

          window.__timelines["s3-chat"] = tl;
        })();
      </script>
