      <script>
        (function () {
          // Tiempo local: 0 = 15.85 s del video
          const tl = gsap.timeline({ paused: true });
          const S1 = 0.15; // 16.0 s
          const S2 = 2.65; // 18.5 s
          const S3 = 5.15; // 21.0 s
          const OUT = 7.84;

          // ---- Etiquetas de paso, subtítulos y progreso
          tl.fromTo("#s4-steps", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, S1);
          const swap = (n, t, first) => {
            tl.fromTo("#s4-label-" + n, { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, t);
            tl.fromTo("#s4-sub-" + n, { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, t + 0.08);
            if (!first) {
              tl.to("#s4-label-" + (n - 1), { opacity: 0, y: -80, duration: 0.32, ease: "power3.in" }, t - 0.2);
              tl.to("#s4-sub-" + (n - 1), { opacity: 0, y: -44, duration: 0.3, ease: "power3.in" }, t - 0.15);
            }
          };
          swap(1, S1, true);
          swap(2, S2, false);
          swap(3, S3, false);
          tl.fromTo("#s4-seg-1", { scaleX: 0 }, { scaleX: 1, duration: S2 - S1, ease: "none" }, S1);
          tl.fromTo("#s4-seg-2", { scaleX: 0 }, { scaleX: 1, duration: S3 - S2, ease: "none" }, S2);
          tl.fromTo("#s4-seg-3", { scaleX: 0 }, { scaleX: 1, duration: 1.6, ease: "power2.out" }, S3);

          const draw = (sel, t, d) => tl.to(sel, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
          const travel = (sel, x0, y0, x1, y1, t, d) => {
            tl.fromTo(sel, { x: x0, y: y0, opacity: 0, scale: 0.5 }, { x: x1, y: y1, opacity: 1, scale: 1, duration: d, ease: "power2.in" }, t);
            tl.to(sel, { opacity: 0, scale: 0.3, duration: 0.12, ease: "power1.in" }, t + d);
          };
          const orbHit = (t) => {
            tl.fromTo("#s4-orb", { scale: 1.12 }, { scale: 1, duration: 0.45, ease: "back.out(3)", immediateRender: false }, t);
            tl.fromTo("#s4-orb-glow", { opacity: 1, scale: 1.25 }, { opacity: 0.75, scale: 1, duration: 0.6, ease: "power2.out", immediateRender: false }, t);
          };

          // ---- 01 Recibe el mensaje
          tl.fromTo("#s4-msg", { opacity: 0, y: -60, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 0.35);
          tl.fromTo("#s4-orb", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 0.5);
          draw("#s4-w-a", 0.95, 0.35);
          travel("#s4-p-a", 540, 680, 540, 850, 1.15, 0.35);
          orbHit(1.5);

          // ---- 02 Entiende y consulta la información del negocio
          [1, 2, 3, 4].forEach((n, k) => {
            tl.fromTo("#s4-chip-" + n, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, S2 + 0.05 + k * 0.15);
          });
          ["#s4-w-b1", "#s4-w-b2", "#s4-w-b3", "#s4-w-b4"].forEach((w, k) => draw(w, S2 + 0.3 + k * 0.05, 0.35));
          travel("#s4-p-b1", 318, 908, 470, 950, S2 + 0.7, 0.4);
          travel("#s4-p-b2", 318, 1052, 470, 1010, S2 + 0.78, 0.4);
          travel("#s4-p-b3", 762, 908, 610, 950, S2 + 0.74, 0.4);
          travel("#s4-p-b4", 762, 1052, 610, 1010, S2 + 0.82, 0.4);
          orbHit(S2 + 1.2);
          tl.fromTo("#s4-ripple-1", { opacity: 0.85, scale: 1 }, { opacity: 0, scale: 1.9, duration: 0.9, ease: "power2.out", immediateRender: false }, S2 + 1.2);
          tl.fromTo("#s4-ripple-2", { opacity: 0.6, scale: 1 }, { opacity: 0, scale: 1.6, duration: 0.8, ease: "power2.out", immediateRender: false }, S2 + 1.55);
          tl.to("#s4-orb-spark", { scale: 1.18, duration: 0.22, ease: "sine.inOut", yoyo: true, repeat: 5 }, S2 + 1.2);

          // El anillo gira más rápido mientras "piensa"
          tl.fromTo("#s4-orb-ring", { rotation: 0 }, { rotation: 220, duration: S2 - 0.5, ease: "none" }, 0.5);
          tl.to("#s4-orb-ring", { rotation: 1000, duration: S3 - S2, ease: "none" }, S2);
          tl.to("#s4-orb-ring", { rotation: 1240, duration: OUT - S3, ease: "none" }, S3);

          // ---- 03 Responde y resuelve
          draw("#s4-w-c", S3 + 0.05, 0.25);
          travel("#s4-p-c", 540, 1114, 540, 1182, S3 + 0.15, 0.25);
          tl.fromTo("#s4-out", { opacity: 0, y: 40, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, S3 + 0.4);
          tl.to("#s4-tick", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, S3 + 0.75);
          tl.fromTo("#s4-msg", { boxShadow: "0 24px 60px rgba(0,0,0,0.45)" }, { boxShadow: "0 24px 60px rgba(0,0,0,0.45), 0 0 0 6px rgba(252,194,4,0.9)", duration: 0.3, ease: "power2.out", immediateRender: false }, S3 + 0.75);

          // ---- Salida: zoom hacia el orbe
          tl.to("#s4-stage", { scale: 1.18, opacity: 0, filter: "blur(18px)", duration: 0.42, ease: "power3.in" }, OUT);

          window.__timelines["s4-how"] = tl;
        })();
      </script>
