  <head>

  <body>
    <template>
      <style>
        #root {

          font-family: "Montserrat", sans-serif;
        }
        #s5-stage {

        }
        #s5-kicker {
          position: absolute;
          left: 84px;
          top: 356px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 32px;
          letter-spacing: 0.16em;

          opacity: 0;
        }
        #s5-act-mask {
          position: absolute;

          top: 404px;

          position: absolute;
          left: 0;

        /* ---------- Calendario ---------- */
        #s5-cal {
          position: absolute;
          left: 60px;
          top: 556px;
          width: 960px;
          height: 820px;
          border-radius: 40px;
          background: #0b1630;
          border: 3px solid rgba(214, 226, 255, 0.16);
          box-shadow: 0 50px 120px rgba(0, 0, 0, 0.55);
          overflow: hidden;
          opacity: 0;
        }
        #s5-month {
          position: absolute;
          left: 36px;
          top: 26px;
          font-weight: 900;
          font-size: 40px;
          letter-spacing: -0.02em;
        }
        #s5-week {
          position: absolute;
          right: 36px;
          top: 34px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 26px;
          color: #9fb0d6;
        }
        .s5-day {
          position: absolute;
          top: 104px;
          width: 162px;
          text-align: center;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 26px;

        .s5-day b {
          display: block;

          font-weight: 900;

          color: #f4f6fb;
        }
        .s5-day.today b {
          color: #fcc204;
        }
        .s5-hour {
          position: absolute;
          left: 20px;
          width: 100px;
          text-align: right;
          font-family: "JetBrains Mono", monospace;

          font-size: 24px;
          color: #9fb0d6;
        }
        .s5-line {
          position: absolute;
          left: 132px;
          width: 810px;
          height: 2px;
          background: rgba(214, 226, 255, 0.1);
        }
        .s5-ev {
          position: absolute;
          width: 150px;
          height: 108px;
          border-radius: 20px;
          background: #1d3a78;
          border: 2px solid rgba(110, 150, 255, 0.55);
          padding: 14px 16px;
          opacity: 0;
        }
        .s5-ev b {
          display: block;
          font-weight: 900;
          font-size: 28px;
          line-height: 1.1;
          color: #f4f6fb;
        }
        .s5-ev span {
          display: block;
          margin-top: 6px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 24px;
          color: #c3cde6;
        }
        #s5-ev-maria {
          background: #fcc204;
          border-color: #fcc204;
          box-shadow: 0 0 40px rgba(252, 194, 4, 0.45);
        }
        #s5-ev-maria b,
        #s5-ev-maria span {
          color: #060c1c;
        }
        #s5-ev-ana {
          box-shadow: 0 0 0 rgba(0, 0, 0, 0);
        }
        #s5-ana-new {
          position: absolute;
          left: 16px;
          top: 50px;
          margin-top: 0;
          opacity: 0;
        }
        .s5-ghost {
          position: absolute;
          width: 150px;
          height: 108px;
          border-radius: 20px;
          border: 3px dashed rgba(214, 226, 255, 0.35);
          opacity: 0;
        }
        #s5-free {
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 24px;
          color: #9fb0d6;
        }
        #s5-x {
          position: absolute;
          width: 70px;
          height: 70px;
          opacity: 0;
        }
        #s5-x svg,
        #s5-bell svg,
        #s5-note-ico svg {
          width: 100%;
          height: 100%;
          display: block;
        }
        #s5-trail {
          position: absolute;
          left: 0;
          top: 0;
          width: 960px;
          height: 820px;
        }
        #s5-ring {
          position: absolute;
          width: 150px;
          height: 108px;
          border-radius: 20px;
          border: 4px solid #fcc204;
          opacity: 0;
        }
        #s5-bell {
          position: absolute;
          width: 46px;
          height: 46px;
          border-radius: 50%;
          background: #060c1c;
          padding: 8px;
          opacity: 0;
        }
        /* Notificación de recordatorio */
        #s5-note {
          position: absolute;
          left: 60px;
          top: 540px;
          width: 960px;
          height: 150px;
          border-radius: 36px;
          background: #f4f6fb;
          box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
          opacity: 0;
        }
        #s5-note-ico {
          position: absolute;
          left: 26px;
          top: 26px;
          width: 98px;
          height: 98px;
          border-radius: 28px;
          background: #fcc204;
          padding: 18px;
        }
        #s5-note-title {
          position: absolute;
          left: 150px;
          top: 30px;
          font-weight: 900;
          font-size: 34px;
          color: #060c1c;
          white-space: nowrap;
        }
        #s5-note-text {
          position: absolute;
          left: 150px;
          top: 82px;
          font-weight: 400;
          font-size: 31px;
          color: #1b3d6a;
          white-space: nowrap;
        }
      </style>

      <div id="root" data-composition-id="s5-calendar" data-width="1080" data-height="1920">
        <div id="s5-stage">
          <div id="s5-kicker">// LO QUE PUEDE HACER</div>
          <div id="s5-act-mask">
            <div class="s5-act" id="s5-act-1"><em>Agenda</em> citas</div>
            <div class="s5-act" id="s5-act-2"><em>Reagenda</em> citas</div>
            <div class="s5-act" id="s5-act-3"><em>Cancela</em> citas</div>
            <div class="s5-act" id="s5-act-4"><em>Envía</em> recordatorios</div>
          </div>

          <div id="s5-cal">
            <div id="s5-month" data-layout-allow-overlap>Octubre</div>
            <div id="s5-week">SEMANA 41</div>
            <div id="s5-grid"></div>
            <svg id="s5-trail" viewBox="0 0 960 820" aria-hidden="true">
              <path id="s5-trail-path" d="M537 250 C620 236 694 290 699 370" fill="none" stroke="#fcc204" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12" stroke-dashoffset="0" opacity="0" />
            </svg>
            <div class="s5-ghost" id="s5-ghost-ana"></div>
            <div class="s5-ghost" id="s5-free">Libre</div>
            <div class="s5-ev" id="s5-ev-luis"><b>Luis</b><span>11:00</span></div>
            <div class="s5-ev" id="s5-ev-carlos"><b>Carlos</b><span>3:00</span></div>
            <div class="s5-ev" id="s5-ev-pedro"><b>Pedro</b><span>4:30</span></div>
            <div class="s5-ev" id="s5-ev-sofia"><b>Sofía</b><span>1:00</span></div>
            <div class="s5-ev" id="s5-ev-ana"><b>Ana</b><span id="s5-ana-old">9:00</span><span id="s5-ana-new">11:00</span></div>
            <div class="s5-ev" id="s5-ev-maria"><b>María</b><span>4:30</span></div>
            <div id="s5-ring"></div>
            <div id="s5-x">
              <svg viewBox="0 0 70 70" aria-hidden="true"><circle cx="35" cy="35" r="32" fill="#fcc204" /><path d="M23 23 L47 47 M47 23 L23 47" stroke="#060c1c" stroke-width="7" stroke-linecap="round" /></svg>
            </div>
            <div id="s5-bell">
              <svg viewBox="0 0 30 30" aria-hidden="true"><path d="M15 4 C10 4 8 8 8 12 V18 L5 22 H25 L22 18 V12 C22 8 20 4 15 4 Z M12 24 a3 3 0 0 0 6 0" fill="#fcc204" /></svg>
            </div>
          </div>

          <div id="s5-note" data-layout-allow-overlap>
            <div id="s5-note-ico">
              <svg viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3 C9.5 3 7.5 7.5 7.5 12 V18 L4 22.5 H26 L22.5 18 V12 C22.5 7.5 20.5 3 15 3 Z M11.5 24.5 a3.5 3.5 0 0 0 7 0" fill="#060c1c" /></svg>
            </div>
            <div id="s5-note-title" data-layout-allow-overlap>Recordatorio para María</div>
            <div id="s5-note-text">Te esperamos mañana a las 4:30 p. m.</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // Tiempo local: 0 = 23.85 s del video
          const tl = gsap.timeline({ paused: true });
          const COL0 = 138; // x de la primera columna (dentro del calendario)
          const COLW = 162;
          const ROW0 = 196; // y de la primera fila
          const ROWH = 120;
          const days = [["LUN", 5], ["MAR", 6], ["MIÉ", 7], ["JUE", 8], ["VIE", 9]];
          const hours = ["9:00", "11:00", "1:00", "3:00", "4:30"];
          const grid = document.getElementById("s5-grid");
          days.forEach(([d, n], c) => {
            const el = document.createElement("div");
            el.className = "s5-day" + (c === 1 ? " today" : "");
            el.style.left = COL0 - 6 + c * COLW + "px";
            el.innerHTML = "<b>" + n + "</b>" + d;
            grid.appendChild(el);
          });
          hours.forEach((h, r) => {
            const el = document.createElement("div");
            el.className = "s5-hour";
            el.style.top = ROW0 + r * ROWH + 38 + "px";
            el.textContent = h;
            grid.appendChild(el);
            const ln = document.createElement("div");
            ln.className = "s5-line";
            ln.style.top = ROW0 + r * ROWH - 6 + "px";
            grid.appendChild(ln);
          });
          const place = (sel, c, r) => {
            const el = document.querySelector(sel);
            el.style.left = COL0 + c * COLW + "px";
            el.style.top = ROW0 + r * ROWH + "px";
          };
          place("#s5-ev-luis", 0, 1);
          place("#s5-ev-carlos", 1, 3);
          place("#s5-ev-pedro", 3, 4);
          place("#s5-ev-sofia", 4, 2);
          place("#s5-ev-ana", 2, 0);
          place("#s5-ev-maria", 2, 4);
          place("#s5-ring", 2, 4);
          place("#s5-ghost-ana", 2, 0);
          place("#s5-free", 4, 2);
          const xEl = document.getElementById("s5-x");
          xEl.style.left = COL0 + 4 * COLW + 40 + "px";
          xEl.style.top = ROW0 + 2 * ROWH + 19 + "px";
          const bell = document.getElementById("s5-bell");
          bell.style.left = COL0 + 2 * COLW + 112 + "px";
          bell.style.top = ROW0 + 4 * ROWH - 16 + "px";

          const IN = 0.15; // 24.0 s
          const A1 = 0.35, A2 = 1.75, A3 = 3.15, A4 = 4.55;
          const OUT = 5.83;

          tl.fromTo("#s5-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, IN);
          // Rótulo de la acción: cambia con cada acción
          const acts = [A1 - 0.2, A2 - 0.15, A3 - 0.15, A4 - 0.15];
          acts.forEach((t, k) => {
            tl.fromTo("#s5-act-" + (k + 1), { opacity: 0, y: 104 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, t);
            if (k < acts.length - 1) tl.to("#s5-act-" + (k + 1), { opacity: 0, y: -104, duration: 0.3, ease: "power3.in" }, acts[k + 1] - 0.18);
          });

          // Calendario con la semana ya ocupada
          tl.fromTo(
            "#s5-cal",
            { opacity: 0, y: 140, scale: 0.92, rotationX: 14, transformPerspective: 1800 },
            { opacity: 1, y: 0, scale: 1, rotationX: 0, transformPerspective: 1800, duration: 0.8, ease: "expo.out" },
            0.0,
          );
          ["#s5-ev-luis", "#s5-ev-carlos", "#s5-ev-pedro", "#s5-ev-sofia", "#s5-ev-ana"].forEach((sel, k) => {
            tl.fromTo(sel, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.2 + k * 0.05);
          });

          // 1) Agenda: la cita de María aparece en su lugar
          tl.fromTo("#s5-ev-maria", { opacity: 0, scale: 0.3, rotation: -8 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.2)" }, A1 + 0.2);
          tl.fromTo("#s5-ring", { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.6, duration: 0.7, ease: "power2.out" }, A1 + 0.3);

          // 2) Reagenda: la cita de Ana salta del miércoles 9:00 al jueves 11:00
          tl.fromTo("#s5-ghost-ana", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, A2 + 0.1);
          tl.fromTo("#s5-ev-ana", { scale: 1, boxShadow: "0 0 0 rgba(0,0,0,0)" }, { scale: 1.1, boxShadow: "0 24px 50px rgba(0,0,0,0.6)", duration: 0.2, ease: "power2.out", immediateRender: false }, A2 + 0.1);
          tl.to("#s5-ev-ana", { x: COLW, duration: 0.6, ease: "power2.inOut" }, A2 + 0.3);
          tl.to("#s5-ev-ana", { y: ROWH, duration: 0.6, ease: "back.inOut(1.4)" }, A2 + 0.3);
          tl.to("#s5-ev-ana", { scale: 1, boxShadow: "0 0 0 rgba(0,0,0,0)", duration: 0.3, ease: "power2.out" }, A2 + 0.9);
          tl.fromTo("#s5-trail-path", { opacity: 0, strokeDashoffset: 0 }, { opacity: 0.9, strokeDashoffset: -66, duration: 0.6, ease: "none" }, A2 + 0.3);
          tl.to("#s5-trail-path", { opacity: 0, duration: 0.25, ease: "power1.in" }, A2 + 0.9);
          tl.to("#s5-ghost-ana", { opacity: 0, duration: 0.35, ease: "power1.in" }, A2 + 0.95);
          tl.set("#s5-ana-old", { opacity: 0 }, A2 + 0.6);
          tl.set("#s5-ana-new", { opacity: 1 }, A2 + 0.6);
          tl.fromTo("#s5-ev-ana", { borderColor: "rgba(110,150,255,0.55)" }, { borderColor: "#fcc204", duration: 0.2, ease: "none", immediateRender: false }, A2 + 0.9);

          // 3) Cancela: la cita de Sofía se marca y deja el espacio libre
          tl.fromTo("#s5-x", { opacity: 0, scale: 2.2, rotation: -60 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.35, ease: "power4.out" }, A3 + 0.15);
          tl.to("#s5-ev-sofia", { opacity: 0.35, duration: 0.2, ease: "none" }, A3 + 0.3);
          tl.to(["#s5-ev-sofia", "#s5-x"], { scale: 0, opacity: 0, duration: 0.35, ease: "back.in(2)" }, A3 + 0.75);
          tl.fromTo("#s5-free", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, A3 + 1.0);

          // 4) Recordatorio: llega la notificación y la cita de María recibe la campana
          tl.fromTo("#s5-note", { opacity: 0, y: -120, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, A4 + 0.15);
          tl.fromTo("#s5-note-ico", { rotation: 0 }, { rotation: 16, duration: 0.08, ease: "sine.inOut", yoyo: true, repeat: 7, immediateRender: false }, A4 + 0.5);
          tl.fromTo("#s5-bell", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(3)" }, A4 + 0.35);

          // Salida: barrido lateral
          tl.to("#s5-stage", { x: -320, opacity: 0, filter: "blur(20px)", duration: 0.38, ease: "power3.in" }, OUT);

          window.__timelines["s5-calendar"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
