        .s6-tile {

        .s6-name span {

          position: absolute;
          inset: -3px;
          border-radius: 38px;
          border: 4px solid #fcc204;
          box-shadow:
            0 0 40px rgba(252, 194, 4, 0.45),
            inset 0 0 30px rgba(252, 194, 4, 0.15);
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="s6-more" data-width="1080" data-height="1920">
        <div id="s6-stage">
          <div id="s6-title"><span>Y</span> <span>mucho</span> <span><em>más:</em></span></div>

          <div class="s6-tile" style="left: 70px; top: 520px">
            <div class="s6-ico"><svg viewBox="0 0 88 88" aria-hidden="true"><path d="M22 24 h44 a7 7 0 0 1 7 7 v20 a7 7 0 0 1 -7 7 h-22 l-12 10 v-10 h-10 a7 7 0 0 1 -7 -7 v-20 a7 7 0 0 1 7 -7 z" fill="#060c1c" /><path d="M39 35 a6 6 0 1 1 8 5.5 c-2 1 -3 2 -3 4.5" fill="none" stroke="#fcc204" stroke-width="4.5" stroke-linecap="round" /><circle cx="44" cy="51" r="2.8" fill="#fcc204" /></svg></div>
            <div class="s6-name"><span>Preguntas</span><span><em>frecuentes</em></span></div>
            <div class="s6-glow"></div>
          </div>
          <div class="s6-tile" style="left: 555px; top: 520px">
            <div class="s6-ico"><svg viewBox="0 0 88 88" aria-hidden="true"><path d="M44 18 C31 18 24 28 24 37 C24 45 29 49 32 53 C34 56 35 59 35 62 H53 C53 59 54 56 56 53 C59 49 64 45 64 37 C64 28 57 18 44 18 Z" fill="none" stroke="#060c1c" stroke-width="5.5" stroke-linejoin="round" /><path d="M36 69 H52 M38 76 H50" stroke="#060c1c" stroke-width="5.5" stroke-linecap="round" /></svg></div>
            <div class="s6-name"><span>Resuelve</span><span><em>dudas</em></span></div>
            <div class="s6-glow"></div>
          </div>
          <div class="s6-tile" style="left: 70px; top: 790px">
            <div class="s6-ico"><svg viewBox="0 0 88 88" aria-hidden="true"><path d="M24 34 H64 L60 70 H28 Z" fill="none" stroke="#060c1c" stroke-width="5.5" stroke-linejoin="round" /><path d="M34 34 V30 a10 10 0 0 1 20 0 V34" fill="none" stroke="#060c1c" stroke-width="5.5" stroke-linecap="round" /></svg></div>
            <div class="s6-name"><span>Toma</span><span><em>pedidos</em></span></div>
            <div class="s6-glow"></div>
          </div>
          <div class="s6-tile" style="left: 555px; top: 790px">
            <div class="s6-ico"><svg viewBox="0 0 88 88" aria-hidden="true"><path d="M28 18 H52 L64 30 V70 H28 Z" fill="none" stroke="#060c1c" stroke-width="5.5" stroke-linejoin="round" /><path d="M50 40 H41 a4.5 4.5 0 0 0 0 9 h5 a4.5 4.5 0 0 1 0 9 H37 M45 35 V63" fill="none" stroke="#060c1c" stroke-width="4.5" stroke-linecap="round" /></svg></div>
            <div class="s6-name"><span>Cotiza</span><span><em>servicios</em></span></div>
            <div class="s6-glow"></div>
          </div>
          <div class="s6-tile" style="left: 70px; top: 1060px">
            <div class="s6-ico"><svg viewBox="0 0 88 88" aria-hidden="true"><circle cx="38" cy="34" r="10" fill="none" stroke="#060c1c" stroke-width="5.5" /><path d="M20 66 C22 52 54 52 56 66" fill="none" stroke="#060c1c" stroke-width="5.5" stroke-linecap="round" /><path d="M58 30 a12 12 0 0 1 8 18 M66 48 l-1 -7 M66 48 l-7 -1" fill="none" stroke="#060c1c" stroke-width="4.5" stroke-linecap="round" /></svg></div>
            <div class="s6-name"><span>Seguimiento</span><span><em>a clientes</em></span></div>
            <div class="s6-glow"></div>

          <div class="s6-tile" style="left: 555px; top: 1060px">
            <div class="s6-ico"><svg viewBox="0 0 88 88" aria-hidden="true"><circle cx="44" cy="44" r="24" fill="none" stroke="#060c1c" stroke-width="5.5" /><path d="M44 30 V44 L54 50" fill="none" stroke="#060c1c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
            <div class="s6-name"><span>Atiende</span><span><em>24/7</em></span></div>

          </div>

      </div>

      <script>
        (function () {
          // Tiempo local: 0 = 29.85 s del video
          const tl = gsap.timeline({ paused: true });
          const IN = 0.15; // 30.0 s
          const OUT = 3.84;

          gsap.utils.toArray("#s6-title span").forEach((w, i) => {
            tl.fromTo(w, { opacity: 0, y: 80, rotation: 5 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "power4.out" }, IN + i * 0.08);
          });
          const tiles = gsap.utils.toArray(".s6-tile");
          // Cada tarjeta entra en una corchea (30.2 → 31.45 s)
          tiles.forEach((tile, i) => {
            const t = 0.35 + i * 0.25;
            tl.fromTo(
              tile,
              { opacity: 0, y: 70, scale: 0.85, rotationX: -35, transformPerspective: 1400 },
              { opacity: 1, y: 0, scale: 1, rotationX: 0, transformPerspective: 1400, duration: 0.55, ease: "back.out(1.6)" },
              t,
            );
            tl.fromTo(tile.querySelector(".s6-ico"), { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.6)" }, t + 0.1);
          });
          // Un destello recorre las capacidades una por una
          tiles.forEach((tile, i) => {
            const t = 2.1 + i * 0.22;
            const glow = tile.querySelector(".s6-glow");
            tl.fromTo(glow, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, t);
            tl.to(glow, { opacity: 0, duration: 0.45, ease: "power1.in" }, t + 0.18);
            tl.fromTo(tile.querySelector(".s6-ico"), { scale: 1 }, { scale: 1.15, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t);
          });

          // Salida: las tarjetas se van escalonadas
          tiles.forEach((tile, i) => {
            tl.to(tile, { opacity: 0, y: -60, scale: 0.9, duration: 0.3, ease: "power2.in" }, OUT + i * 0.03);
          });
          tl.to("#s6-title", { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, OUT);

          window.__timelines["s6-more"] = tl;
        })();
      </script>
    </template>
