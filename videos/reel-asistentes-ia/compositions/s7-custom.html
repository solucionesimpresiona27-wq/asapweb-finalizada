            <span class="s7-line">Lo configuramos</span>
            <span class="s7-line">para <em>tu negocio</em></span>

          <div id="s7-panel">
            <div class="s7-cap" style="top: 40px">TIPO DE NEGOCIO</div>

            </div>

              <div class="s7-sw"><div class="s7-sw-on"></div><div class="s7-knob"></div></div>
              <div class="s7-task">Enviar recordatorios</div>

      <script>
        (function () {
          // Tiempo local: 0 = 33.85 s del video
          const tl = gsap.timeline({ paused: true });
          const IN = 0.15; // 34.0 s
          const OUT = 5.84;

          tl.fromTo("#s7-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, IN);
          gsap.utils.toArray("#s7-head .s7-line").forEach((el, i) => {
            tl.fromTo(el, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "power4.out" }, IN + 0.08 + i * 0.14);
          });
          tl.fromTo(
            "#s7-panel",
            { opacity: 0, y: 150, scale: 0.92, rotationX: 14, transformPerspective: 1800 },
            { opacity: 1, y: 0, scale: 1, rotationX: 0, transformPerspective: 1800, duration: 0.8, ease: "expo.out" },
            IN + 0.15,
          );

          // Tipo de negocio: gira como ruleta y se detiene en "Tu negocio"
          const TYPES = [0.55, 0.85, 1.15, 1.45, 1.8];
          TYPES.forEach((t, k) => {
            const id = "#s7-type-" + (k + 1);
            const last = k === TYPES.length - 1;
            tl.fromTo(id, { opacity: 0, y: 72 }, { opacity: 1, y: 0, duration: last ? 0.45 : 0.22, ease: last ? "back.out(2.4)" : "power2.out" }, t);
            if (!last) tl.to(id, { opacity: 0, y: -72, duration: 0.2, ease: "power2.in" }, TYPES[k + 1] - 0.02);
          });
          tl.fromTo("#s7-type-line", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 1.95);

          // Tareas: aparecen y se encienden en corcheas
          [1, 2, 3, 4].forEach((n, k) => {
            tl.fromTo("#s7-row-" + n, { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 0.75 + k * 0.1);
          });
          const switchOn = (n, t) => {
            const row = "#s7-row-" + n;
            tl.fromTo(row + " .s7-knob", { x: 0 }, { x: 44, duration: 0.22, ease: "back.out(2)" }, t);
            tl.fromTo(row + " .s7-sw-on", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, t);
            tl.fromTo(row + " .s7-knob", { backgroundColor: "#f4f6fb" }, { backgroundColor: "#060c1c", duration: 0.15, ease: "none" }, t);
          };
          switchOn(1, 2.15);
          switchOn(2, 2.4);
          switchOn(3, 2.65);

          // Tarea personalizada: se escribe letra por letra
          const TXT = "Avisar que el pedido está listo";
          const CW = 30 * 0.6; // JetBrains Mono: avance fijo de 0.6em
          const box = document.getElementById("s7-custom-text");
          const T0 = 2.95;
          const STEP = 0.032;
          tl.fromTo("#s7-new", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, T0 - 0.1);
          [...TXT].forEach((ch, i) => {
            const s = document.createElement("span");
            s.textContent = ch;
            box.appendChild(s);
            tl.set(s, { opacity: 1 }, T0 + i * STEP);
            tl.set("#s7-caret", { x: (i + 1) * CW }, T0 + i * STEP);
          });
          const TYPED = T0 + TXT.length * STEP;
          [0.1, 0.4, 0.7, 1.0].forEach((d) => {
            tl.set("#s7-caret", { opacity: 0 }, TYPED + d);
            tl.set("#s7-caret", { opacity: 1 }, TYPED + d + 0.15);
          });
          switchOn(4, 4.1);

          // Entrenamiento con la información del negocio: barra y porcentaje
          const TR = 4.35;
          const TRD = 1.05;
          tl.fromTo("#s7-train", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, TR - 0.1);
          tl.fromTo("#s7-bar-fill", { scaleX: 0 }, { scaleX: 1, duration: TRD, ease: "power2.inOut" }, TR);
          const pct = document.getElementById("s7-pct");
          const ease = gsap.parseEase("power2.inOut");
          const STEPS = 20;
          let prev = null;
          for (let k = 0; k <= STEPS; k++) {
            const span = document.createElement("span");
            span.textContent = Math.round((k / STEPS) * 100) + "%";
            pct.appendChild(span);
            // instante en que la barra (power2.inOut) alcanza este porcentaje
            let lo = 0, hi = 1;
            for (let it = 0; it < 30; it++) {
              const mid = (lo + hi) / 2;
              if (ease(mid) < k / STEPS) lo = mid; else hi = mid;
            }
            const t = TR + hi * TRD;
            tl.set(span, { opacity: 1 }, t);
            if (prev) tl.set(prev, { opacity: 0 }, t);
            prev = span;
          }
          tl.set(prev, { opacity: 0 }, TR + TRD + 0.05);
          tl.fromTo("#s7-done", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.6)" }, TR + TRD + 0.05);

          // Salida
          tl.to("#s7-stage", { y: -260, opacity: 0, filter: "blur(20px)", duration: 0.36, ease: "power3.in" }, OUT);

          window.__timelines["s7-custom"] = tl;
        })();
      </script>
