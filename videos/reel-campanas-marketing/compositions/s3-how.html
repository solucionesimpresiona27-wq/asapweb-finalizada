      <script>
        (function () {
          // Tiempo local: 0 = 11.85 s del video
          const tl = gsap.timeline({ paused: true });
          const S1 = 0.15, S2 = 2.75, S3 = 5.25; // 12.0, 14.6, 17.1 s
          const OUT = 7.84;

          // Puntos del público (deterministas): dentro de la zona se iluminan
          const dots = document.getElementById("s3-dots");
          const inside = [];
          for (let k = 0; k < 34; k++) {
            const a = k * 2.399;
            const r = 70 + ((k * 53) % 230);
            const x = 350 + Math.cos(a) * r;
            const y = 350 + Math.sin(a) * r;
            const d = document.createElement("div");
            d.className = "s3-dot";
            d.style.left = x + "px";
            d.style.top = y + "px";
            dots.appendChild(d);
            if (r < 190) {
              const h = document.createElement("div");
              h.className = "s3-dot in";
              h.style.left = x + "px";
              h.style.top = y + "px";
              dots.appendChild(h);
              inside.push(h);
            }
          }

          tl.fromTo("#s3-steps", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, S1);
          const swap = (n, t, first) => {
            tl.fromTo("#s3-label-" + n, { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, t);
            tl.fromTo("#s3-sub-" + n, { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, t + 0.12);
            if (!first) {
              tl.to("#s3-label-" + (n - 1), { opacity: 0, y: -80, duration: 0.4, ease: "power3.in" }, t - 0.3);
              tl.to("#s3-sub-" + (n - 1), { opacity: 0, y: -46, duration: 0.35, ease: "power3.in" }, t - 0.25);
            }
          };
          swap(1, S1, true);
          swap(2, S2, false);
          swap(3, S3, false);
          tl.fromTo("#s3-seg-1", { scaleX: 0 }, { scaleX: 1, duration: S2 - S1, ease: "none" }, S1);
          tl.fromTo("#s3-seg-2", { scaleX: 0 }, { scaleX: 1, duration: S3 - S2, ease: "none" }, S2);
          tl.fromTo("#s3-seg-3", { scaleX: 0 }, { scaleX: 1, duration: 2.2, ease: "power2.out" }, S3);

          // 01 El anuncio se arma
          tl.fromTo("#s3-p1", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, S1 + 0.2);
          tl.fromTo("#s3-ad", { y: 160, scale: 0.9, rotation: -3 }, { y: 0, scale: 1, rotation: 0, duration: 1.1, ease: "expo.out" }, S1 + 0.2);
          tl.fromTo("#s3-ad-img img", { scale: 1.15 }, { scale: 1, duration: 2.2, ease: "sine.out" }, S1 + 0.3);
          tl.fromTo("#s3-ad-title", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, S1 + 0.9);
          tl.fromTo("#s3-ad-btn", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, S1 + 1.3);
          tl.to("#s3-p1", { opacity: 0, x: -200, duration: 0.5, ease: "power2.in" }, S2 - 0.35);

          // 02 La campaña encuentra a tu público
          tl.fromTo("#s3-p2", { opacity: 0, x: 200 }, { opacity: 1, x: 0, duration: 0.8, ease: "expo.out" }, S2);
          tl.fromTo("#s3-zone", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.9, ease: "back.out(1.4)" }, S2 + 0.3);
          tl.fromTo("#s3-sweep", { rotation: 0 }, { rotation: 540, duration: 2.6, ease: "none" }, S2);
          inside.forEach((d, k) => tl.fromTo(d, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1.2, duration: 0.35, ease: "back.out(3)" }, S2 + 0.8 + k * 0.06));
          ["#s3-t1", "#s3-t2", "#s3-t3"].forEach((t, k) => tl.fromTo(t, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(2)" }, S2 + 0.9 + k * 0.35));
          tl.to("#s3-p2", { opacity: 0, x: -200, duration: 0.5, ease: "power2.in" }, S3 - 0.35);

          // 03 Llegan los mensajes
          tl.fromTo("#s3-p3", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, S3);
          ["#s3-m1", "#s3-m2", "#s3-m3", "#s3-m4"].forEach((m, k) => {
            tl.fromTo(m, { opacity: 0, x: 140, scale: 0.92 }, { opacity: 1, x: 0, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, S3 + 0.2 + k * 0.45);
          });

          tl.to("#s3-stage", { y: -240, opacity: 0, filter: "blur(18px)", duration: 0.45, ease: "power3.in" }, OUT);
          window.__timelines["s3-how"] = tl;
        })();
      </script>
