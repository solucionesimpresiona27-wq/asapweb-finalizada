      <script>
        (function () {
          // Tiempo local: 0 = 19.85 s del video
          const tl = gsap.timeline({ paused: true });
          const IN = 0.15; // 20.0 s
          const OUT = 7.84;

          tl.fromTo("#s4-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, IN);
          gsap.utils.toArray("#s4-head .s4-line").forEach((el, i) => {
            tl.fromTo(el, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.8, ease: "power4.out" }, IN + 0.15 + i * 0.25);
          });

          // Google: alguien busca y aparece tu anuncio
          tl.fromTo("#s4-google", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 1.0, ease: "expo.out" }, 0.6);
          const Q = "restaurante cerca";
          const qEl = document.getElementById("s4-query");
          [...Q].forEach((ch, i) => {
            const s = document.createElement("span");
            s.textContent = ch;
            qEl.appendChild(s);
            tl.set(s, { opacity: 1 }, 1.4 + i * 0.055);
          });
          tl.fromTo("#s4-result", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, 2.6);

          // Meta: tu anuncio aparece en el feed y recibe reacciones
          tl.fromTo("#s4-meta", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 1.0, ease: "expo.out" }, 3.7);
          tl.fromTo("#s4-post-img img", { y: 60 }, { y: 0, duration: 2.5, ease: "sine.out" }, 3.7);
          gsap.utils.toArray("#s4-meta .s4-heart").forEach((h, k) => {
            tl.fromTo(h, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(3)" }, 4.7 + k * 0.3);
          });
          tl.fromTo("#s4-post-btn", { scale: 1 }, { scale: 1.08, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 5.8);

          tl.to("#s4-stage", { y: -240, opacity: 0, filter: "blur(18px)", duration: 0.45, ease: "power3.in" }, OUT);
          window.__timelines["s4-platforms"] = tl;
        })();
