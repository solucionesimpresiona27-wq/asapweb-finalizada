            </svg>

      <script>
        (function () {
          // Tiempo local: 0 = 41.85 s del video (ritmo pausado)
          const tl = gsap.timeline({ paused: true });
          const IN = 0.15; // 42.0 s
          const SLAM = 0.75; // 42.6 s
          const BTN = 1.75; // 43.6 s
          const CLICK = 4.15; // 46.0 s
          const OUT = 5.15; // 47.0 s

          tl.fromTo("#s7-glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, IN);
          tl.fromTo(
            "#s7-l1",
            { opacity: 0, y: 70, filter: "blur(12px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" },
            IN,
          );
          // MÁS CLIENTES? letra por letra desde el centro
          const letters = gsap.utils.toArray("#s7-l2 span");
          const mid = (letters.length - 1) / 2;
          letters.forEach((el, i) => {
            const d = Math.abs(i - mid);
            tl.fromTo(
              el,
              { opacity: 0, y: 120, scale: 1.5 },
              { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.7)" },
              SLAM + d * 0.05,
            );
          });

          // Botón: aparece con rebote
          tl.fromTo("#s7-btn", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, BTN);
          tl.fromTo("#s7-btn-row", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, BTN + 0.18);
          tl.fromTo("#s7-shine", { x: 0, rotation: 18 }, { x: 1180, rotation: 18, duration: 0.7, ease: "power2.inOut" }, BTN + 0.35);

          // Cursor: llega y hace clic justo en el compás (46 s)
          const TX = 760;
          const TY = 1080;
          tl.fromTo("#s7-cursor", { x: 1140, y: 1580 }, { x: TX, y: TY - 8, duration: 0.9, ease: "power3.out" }, CLICK - 0.95);
          tl.fromTo(["#s7-cursor", "#s7-btn"], { scale: 1 }, { scale: 0.93, duration: 0.08, ease: "power2.in", immediateRender: false }, CLICK);
          tl.to(["#s7-cursor", "#s7-btn"], { scale: 1, duration: 0.4, ease: "back.out(3)" }, CLICK + 0.08);
          tl.set(".s7-ripple", { x: TX - 540 + 10, y: 0 }, 0);
          tl.fromTo("#s7-ripple-1", { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 3, duration: 0.8, ease: "power2.out", immediateRender: false }, CLICK);
          tl.fromTo("#s7-ripple-2", { opacity: 0.6, scale: 0.3 }, { opacity: 0, scale: 2, duration: 0.7, ease: "power2.out", immediateRender: false }, CLICK + 0.12);
          tl.fromTo("#s7-shine", { x: 0 }, { x: 1180, duration: 0.6, ease: "power2.inOut", immediateRender: false }, CLICK + 0.05);
          tl.to("#s7-cursor", { x: 1160, y: 1700, duration: 0.5, ease: "power3.in" }, CLICK + 0.55);

          // Indicación final
          tl.fromTo("#s7-sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, CLICK + 0.3);

          // El brillo late con el bombo
          for (let t = 2.65; t < OUT; t += 0.5) {
            tl.fromTo("#s7-glow", { scale: 1.06 }, { scale: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, t);
          }

          // Salida escalonada: deja el escenario limpio para el logo
          tl.to("#s7-sub", { opacity: 0, y: 20, duration: 0.3, ease: "power2.in" }, OUT);
          tl.to("#s7-btn", { opacity: 0, scale: 0.85, filter: "blur(10px)", duration: 0.35, ease: "power2.in" }, OUT + 0.04);
          tl.to(["#s7-l1", "#s7-l2"], { opacity: 0, y: -40, filter: "blur(12px)", duration: 0.35, ease: "power2.in" }, OUT + 0.08);
          tl.to("#s7-glow", { opacity: 0, duration: 0.4, ease: "power1.in" }, OUT);

          window.__timelines["s7-cta"] = tl;
        })();
      </script>
