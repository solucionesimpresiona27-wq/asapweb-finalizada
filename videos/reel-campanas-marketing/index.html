<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Soluciones Impresiona — Reel campañas de marketing</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #060c1c;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #060c1c;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #world {
        z-index: 1;
      }
      .scene {
        z-index: 2;
      }
      #s8-finale {
        z-index: 3;
      }
      #brand {
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <!--
      Soluciones Impresiona — reel de 53 s sobre campañas de publicidad (Google Ads y Meta Ads),
      1080x1920, 30 fps. Ritmo pausado. Música a 120 BPM: cortes en 6, 12, 20, 28, 36, 42 y 48 s.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="53"
      data-width="1080"
      data-height="1920"
    >
      <!-- Fondo persistente -->
      <div
        id="world"
        data-composition-id="world"
        data-composition-src="compositions/world.html"
        data-start="0"
        data-duration="53"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Gancho: los clientes no llegan solos -->
      <div
        id="s1-hook" class="scene"
        data-composition-id="s1-hook"
        data-composition-src="compositions/s1-hook.html"
        data-start="0"
        data-duration="6.15"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Campañas que atraen clientes (drop) -->
      <div
        id="s2-title" class="scene"
        data-composition-id="s2-title"
        data-composition-src="compositions/s2-title.html"
        data-start="5.85"
        data-duration="6.3"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Cómo funciona: campaña, público, mensajes -->
      <div
        id="s3-how" class="scene"
        data-composition-id="s3-how"
        data-composition-src="compositions/s3-how.html"
        data-start="11.85"
        data-duration="8.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Google Ads y Meta Ads -->
      <div
        id="s4-platforms" class="scene"
        data-composition-id="s4-platforms"
        data-composition-src="compositions/s4-platforms.html"
        data-start="19.85"
        data-duration="8.3"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Así llegan tus clientes -->
      <div
        id="s5-funnel" class="scene"
        data-composition-id="s5-funnel"
        data-composition-src="compositions/s5-funnel.html"
        data-start="27.85"
        data-duration="8.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Nosotros conseguimos los clientes, tú respondes -->
      <div
        id="s6-roles" class="scene"
        data-composition-id="s6-roles"
        data-composition-src="compositions/s6-roles.html"
        data-start="35.85"
        data-duration="6.3"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Llamado a la acción -->
      <div
        id="s7-cta" class="scene"
        data-composition-id="s7-cta"
        data-composition-src="compositions/s7-cta.html"
        data-start="41.85"
        data-duration="5.75"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- La bombilla se enciende y la luz llena la pantalla -->
      <div
        id="s8-finale"
        data-composition-id="s8-finale"
        data-composition-src="compositions/s8-finale.html"
        data-start="47.9"
        data-duration="5.1"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Logo: fijo arriba; al final a pantalla completa -->
      <div
        id="brand"
        data-composition-id="brand"
        data-composition-src="compositions/brand.html"
        data-start="0"
        data-duration="53"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Música original (scripts/compose_music.py) -->
      <audio id="music" src="assets/audio/music.mp3" data-start="0" data-duration="53" data-track-index="10" data-volume="0.85"></audio>

      <!-- Efectos de sonido, sincronizados con cada movimiento -->
      <!-- Escena 1 · sin mensajes -->
      <audio id="sfx-phone" src="assets/audio/sfx/whoosh-short.mp3" data-start="1.1" data-duration="0.57" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-riser" src="assets/audio/sfx/riser.mp3" data-start="3" data-duration="3.25" data-track-index="11" data-volume="0.42"></audio>
      <audio id="sfx-ask" src="assets/audio/sfx/ping.mp3" data-start="3.4" data-duration="1" data-track-index="12" data-volume="0.45"></audio>
      <audio id="sfx-zoom-1" src="assets/audio/sfx/whoosh.mp3" data-start="5.5" data-duration="0.57" data-track-index="12" data-volume="0.45"></audio>
      <!-- Escena 2 · drop: campañas que atraen clientes -->
      <audio id="sfx-drop" src="assets/audio/sfx/impact-bass-1.mp3" data-start="6" data-duration="2.1" data-track-index="13" data-volume="0.6"></audio>
      <audio id="sfx-clientes" src="assets/audio/sfx/whoosh-short.mp3" data-start="6.9" data-duration="0.57" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-ads" src="assets/audio/sfx/whoosh-short.mp3" data-start="8" data-duration="0.57" data-track-index="11" data-volume="0.22"></audio>
      <audio id="sfx-tag-1" src="assets/audio/sfx/pop.mp3" data-start="9" data-duration="0.6" data-track-index="11" data-volume="0.25"></audio>
      <audio id="sfx-tag-2" src="assets/audio/sfx/pop.mp3" data-start="9.4" data-duration="0.6" data-track-index="12" data-volume="0.25"></audio>
      <audio id="sfx-tag-3" src="assets/audio/sfx/pop.mp3" data-start="9.8" data-duration="0.6" data-track-index="11" data-volume="0.25"></audio>
      <audio id="sfx-out-2" src="assets/audio/sfx/whoosh.mp3" data-start="11.65" data-duration="0.57" data-track-index="11" data-volume="0.45"></audio>
      <!-- Escena 3 · cómo funciona -->
      <audio id="sfx-ad-in" src="assets/audio/sfx/whoosh-short.mp3" data-start="12.05" data-duration="0.57" data-track-index="12" data-volume="0.25"></audio>
      <audio id="sfx-ad-title" src="assets/audio/sfx/click-soft.mp3" data-start="12.75" data-duration="0.36" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-ad-btn" src="assets/audio/sfx/pop.mp3" data-start="13.15" data-duration="0.6" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-to-radar" src="assets/audio/sfx/whoosh-short.mp3" data-start="14.25" data-duration="0.57" data-track-index="11" data-volume="0.28"></audio>
      <audio id="sfx-zone" src="assets/audio/sfx/sparkle.mp3" data-start="14.9" data-duration="1.6" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-target-1" src="assets/audio/sfx/pop.mp3" data-start="15.5" data-duration="0.6" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-target-2" src="assets/audio/sfx/pop.mp3" data-start="15.85" data-duration="0.6" data-track-index="13" data-volume="0.3"></audio>
      <audio id="sfx-target-3" src="assets/audio/sfx/pop.mp3" data-start="16.2" data-duration="0.6" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-to-msgs" src="assets/audio/sfx/whoosh-short.mp3" data-start="16.75" data-duration="0.57" data-track-index="11" data-volume="0.28"></audio>
      <audio id="sfx-msgs" src="assets/audio/sfx/notification.mp3" data-start="17.25" data-duration="1.2" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-msg-1" src="assets/audio/sfx/pop.mp3" data-start="17.25" data-duration="0.6" data-track-index="13" data-volume="0.38"></audio>
      <audio id="sfx-msg-2" src="assets/audio/sfx/pop.mp3" data-start="17.7" data-duration="0.6" data-track-index="11" data-volume="0.38"></audio>
      <audio id="sfx-msg-3" src="assets/audio/sfx/pop.mp3" data-start="18.15" data-duration="0.6" data-track-index="13" data-volume="0.38"></audio>
      <audio id="sfx-msg-4" src="assets/audio/sfx/pop.mp3" data-start="18.6" data-duration="0.6" data-track-index="11" data-volume="0.38"></audio>
      <audio id="sfx-out-3" src="assets/audio/sfx/whoosh.mp3" data-start="19.69" data-duration="0.57" data-track-index="11" data-volume="0.45"></audio>
      <!-- Escena 4 · Google Ads y Meta Ads -->
      <audio id="sfx-google" src="assets/audio/sfx/whoosh-short.mp3" data-start="20.45" data-duration="0.57" data-track-index="11" data-volume="0.25"></audio>
      <audio id="sfx-search" src="assets/audio/sfx/typing.mp3" data-start="21.25" data-duration="1" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-result" src="assets/audio/sfx/pop.mp3" data-start="22.45" data-duration="0.6" data-track-index="11" data-volume="0.42"></audio>
      <audio id="sfx-result-ping" src="assets/audio/sfx/ping.mp3" data-start="22.5" data-duration="1" data-track-index="12" data-volume="0.28"></audio>
      <audio id="sfx-meta" src="assets/audio/sfx/whoosh-short.mp3" data-start="23.55" data-duration="0.57" data-track-index="11" data-volume="0.25"></audio>
      <audio id="sfx-react-1" src="assets/audio/sfx/pop.mp3" data-start="24.55" data-duration="0.5" data-track-index="11" data-volume="0.32"></audio>
      <audio id="sfx-react-2" src="assets/audio/sfx/pop.mp3" data-start="24.85" data-duration="0.5" data-track-index="12" data-volume="0.32"></audio>
      <audio id="sfx-react-3" src="assets/audio/sfx/pop.mp3" data-start="25.15" data-duration="0.6" data-track-index="11" data-volume="0.32"></audio>
      <audio id="sfx-out-4" src="assets/audio/sfx/whoosh.mp3" data-start="27.69" data-duration="0.57" data-track-index="11" data-volume="0.45"></audio>
      <!-- Escena 5 · embudo -->
      <audio id="sfx-stage-1" src="assets/audio/sfx/click-soft.mp3" data-start="28.75" data-duration="0.36" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-stage-2" src="assets/audio/sfx/click-soft.mp3" data-start="29.5" data-duration="0.36" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-stage-3" src="assets/audio/sfx/click-soft.mp3" data-start="30.25" data-duration="0.36" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-stage-4" src="assets/audio/sfx/pop.mp3" data-start="31" data-duration="0.6" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-clients" src="assets/audio/sfx/sparkle.mp3" data-start="31.1" data-duration="1.6" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-optimize" src="assets/audio/sfx/chime.mp3" data-start="32.45" data-duration="1.4" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-out-5" src="assets/audio/sfx/whoosh.mp3" data-start="35.69" data-duration="0.57" data-track-index="11" data-volume="0.45"></audio>
      <!-- Escena 6 · nosotros / tú -->
      <audio id="sfx-us-1" src="assets/audio/sfx/pop.mp3" data-start="37.05" data-duration="0.6" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-us-2" src="assets/audio/sfx/pop.mp3" data-start="37.43" data-duration="0.6" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-us-3" src="assets/audio/sfx/pop.mp3" data-start="37.81" data-duration="0.6" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-us-4" src="assets/audio/sfx/pop.mp3" data-start="38.19" data-duration="0.6" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-you" src="assets/audio/sfx/whoosh-short.mp3" data-start="38.85" data-duration="0.57" data-track-index="11" data-volume="0.25"></audio>
      <audio id="sfx-you-text" src="assets/audio/sfx/ping.mp3" data-start="39.25" data-duration="1" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-you-glow" src="assets/audio/sfx/sparkle.mp3" data-start="39.65" data-duration="1.6" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-out-6" src="assets/audio/sfx/whoosh.mp3" data-start="41.69" data-duration="0.57" data-track-index="11" data-volume="0.45"></audio>
      <!-- Escena 7 · llamado a la acción -->
      <audio id="sfx-cta-line" src="assets/audio/sfx/whoosh-short.mp3" data-start="42" data-duration="0.57" data-track-index="12" data-volume="0.28"></audio>
      <audio id="sfx-cta-slam" src="assets/audio/sfx/ping.mp3" data-start="42.6" data-duration="1" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-cta-button" src="assets/audio/sfx/pop.mp3" data-start="43.6" data-duration="0.6" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-cursor" src="assets/audio/sfx/whoosh-short.mp3" data-start="45.05" data-duration="0.57" data-track-index="11" data-volume="0.2"></audio>
      <audio id="sfx-cta-click" src="assets/audio/sfx/click.mp3" data-start="46" data-duration="0.36" data-track-index="11" data-volume="0.9"></audio>
      <audio id="sfx-cta-ok" src="assets/audio/sfx/chime.mp3" data-start="46.05" data-duration="1.4" data-track-index="13" data-volume="0.45"></audio>
      <!-- Final · el foco se enciende -->
      <audio id="sfx-swell" src="assets/audio/sfx/whoosh-cinematic.mp3" data-start="45.1" data-duration="4.4" data-track-index="12" data-volume="0.55"></audio>
      <audio id="sfx-finale-hit" src="assets/audio/sfx/impact-bass-1.mp3" data-start="48" data-duration="2.1" data-track-index="11" data-volume="0.68"></audio>
      <audio id="sfx-finale-shine" src="assets/audio/sfx/sparkle.mp3" data-start="48.05" data-duration="1.6" data-track-index="13" data-volume="0.5"></audio>
      <audio id="sfx-tagline" src="assets/audio/sfx/chime.mp3" data-start="48.8" data-duration="2.5" data-track-index="14" data-volume="0.38"></audio>
    </div>
    <script>
      // Toda la animación vive en las sub-composiciones; la raíz solo ordena tiempos.
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
