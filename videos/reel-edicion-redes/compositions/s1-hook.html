<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Escena 1 — Gancho: la primera impresión</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #f4f6fb;
          font-family: "Montserrat", sans-serif;
        }
        #s1-stage {
          position: absolute;
          inset: 0;
          transform-origin: 540px 960px;
        }
        #s1-head {
          position: absolute;
          left: 84px;
          top: 350px;
          width: 912px;
        }
        .s1-line {
          display: block;
          font-weight: 900;
          font-size: 70px;
          line-height: 1.06;
          letter-spacing: -0.035em;
          opacity: 0;
        }
        #s1-phone {
          position: absolute;
          left: 290px;
          top: 560px;
          width: 500px;
          height: 760px;
          border-radius: 48px;
          background: #0b1630;
          border: 8px solid #1d2a48;
          box-shadow: 0 50px 120px rgba(0, 0, 0, 0.6);
          overflow: hidden;
          opacity: 0;
        }
        #s1-post-head {
          position: absolute;
          left: 22px;
          top: 22px;
          display: flex;
          align-items: center;
          gap: 14px;
          font-weight: 700;
          font-size: 26px;
          color: #c3cde6;
        }
        #s1-post-head i {
          display: block;
          width: 48px;
          height: 48px;
          border-radius: 50%;
          background: #3a4766;
        }
        #s1-img {
          position: absolute;
          left: 0;
          top: 90px;
          width: 484px;
          height: 520px;
          overflow: hidden;
        }
        #s1-img img {
          position: absolute;
          left: -30px;
          top: -60px;
          width: 560px;
          height: 700px;
          display: block;
          filter: grayscale(0.85) brightness(0.62) contrast(0.7) blur(2px);
        }
        .s1-cap {
          position: absolute;
          left: 22px;
          height: 14px;
          border-radius: 7px;
          background: rgba(214, 226, 255, 0.18);
        }
        #s1-likes {
          position: absolute;
          left: 22px;
          top: 626px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 24px;
          color: #9fb0d6;
        }
        #s1-ask {
          position: absolute;
          left: 0;
          top: 1352px;
          width: 1080px;
          text-align: center;
          font-weight: 900;
          font-size: 76px;
          line-height: 1;
          letter-spacing: -0.04em;
          color: #fcc204;
          text-shadow: 0 0 60px rgba(252, 194, 4, 0.35);
          white-space: nowrap;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="s1-hook" data-width="1080" data-height="1920">
        <div id="s1-stage">
          <div id="s1-head">
            <span class="s1-line">Tus clientes te conocen</span>
            <span class="s1-line">primero en redes.</span>
          </div>

          <div id="s1-phone">
            <div id="s1-post-head"><i></i>tu_negocio</div>
            <div id="s1-img"><img src="assets/scenes/cafe.svg" alt="" /></div>
            <div id="s1-likes">3 me gusta</div>
            <div class="s1-cap" style="top: 672px; width: 380px"></div>
            <div class="s1-cap" style="top: 700px; width: 260px"></div>
          </div>

          <div id="s1-ask">¿Qué impresión se llevan?</div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          gsap.utils.toArray("#s1-head .s1-line").forEach((el, i) => {
            tl.fromTo(el, { opacity: 0, y: 60, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, 0.3 + i * 0.35);
          });
          // La publicación llega como al deslizar el feed
          tl.fromTo("#s1-phone", { opacity: 0, y: 220 }, { opacity: 1, y: 0, duration: 1.3, ease: "expo.out" }, 1.1);
          tl.fromTo("#s1-img img", { scale: 1 }, { scale: 1.06, duration: 4.4, ease: "none" }, 1.1);
          // Pregunta, con calma
          tl.fromTo("#s1-ask", { opacity: 0, scale: 1.2, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, 3.4);

          // Salida suave hacia la cámara justo antes del drop (6 s)
          tl.to("#s1-stage", { scale: 1.25, opacity: 0, filter: "blur(18px)", duration: 0.55, ease: "power2.in" }, 5.5);

          window.__timelines["s1-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
