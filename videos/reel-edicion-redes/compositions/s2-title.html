<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Escena 2 — Edición de fotos y videos para redes</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #f4f6fb;
          font-family: "Montserrat", sans-serif;
        }
        #s2-stage {
          position: absolute;
          inset: 0;
        }
        #s2-ghost {
          position: absolute;
          left: -40px;
          top: 380px;
          font-weight: 900;
          font-size: 400px;
          line-height: 1;
          letter-spacing: -0.05em;
          color: #111e3e;
          white-space: nowrap;
        }
        #s2-block {
          position: absolute;
          left: 84px;
          top: 560px;
          width: 912px;
        }
        #s2-kicker {
          display: block;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 32px;
          letter-spacing: 0.16em;
          color: #fcc204;
          margin-bottom: 24px;
          opacity: 0;
        }
        #s2-l1,
        #s2-l4 {
          display: block;
          font-weight: 700;
          font-size: 84px;
          line-height: 1;
          letter-spacing: -0.02em;
          opacity: 0;
        }
        #s2-l4 {
          margin-top: 34px;
          font-size: 76px;
        }
        #s2-l2 {
          display: block;
          margin-top: 16px;
          font-weight: 900;
          font-size: 168px;
          line-height: 0.92;
          letter-spacing: -0.05em;
          opacity: 0;
          transform-origin: 0% 70%;
        }
        #s2-l2 em {
          font-style: normal;
          font-weight: 700;
          font-size: 96px;
          letter-spacing: -0.02em;
          color: #c3cde6;
        }
        #s2-l3 {
          position: relative;
          margin-top: 22px;
          width: 700px;
          height: 196px;
        }
        #s2-l3-fill {
          position: absolute;
          left: 0;
          top: 0;
          width: 700px;
          height: 196px;
          border-radius: 26px;
          background: #fcc204;
          box-shadow: 0 0 90px rgba(252, 194, 4, 0.35);
          transform-origin: 0% 50%;
        }
        #s2-l3-text {
          position: absolute;
          left: 38px;
          top: 18px;
          font-weight: 900;
          font-size: 168px;
          line-height: 0.92;
          letter-spacing: -0.05em;
          color: #060c1c;
          white-space: nowrap;
        }
        #s2-tags {
          display: flex;
          gap: 20px;
          margin-top: 56px;
        }
        .s2-tag {
          display: flex;
          align-items: center;
          gap: 12px;
          height: 64px;
          padding: 0 26px;
          border-radius: 32px;
          border: 2px solid rgba(214, 226, 255, 0.24);
          background: rgba(214, 226, 255, 0.06);
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 28px;
          color: #dfe5f3;
          opacity: 0;
        }
        .s2-tag i {
          display: block;
          width: 14px;
          height: 14px;
          border-radius: 4px;
          background: #fcc204;
        }
      </style>

      <div id="root" data-composition-id="s2-title" data-width="1080" data-height="1920">
        <div id="s2-stage">
          <div id="s2-ghost" data-layout-allow-overflow data-layout-allow-overlap aria-hidden="true">REDES REDES</div>
          <div id="s2-block">
            <span id="s2-kicker">// NUESTRA ESPECIALIDAD</span>
            <span id="s2-l1">Edición de</span>
            <span id="s2-l2" data-layout-allow-overlap>FOTOS <em>y</em></span>
            <div id="s2-l3">
              <div id="s2-l3-fill"></div>
              <div id="s2-l3-text">VIDEOS</div>
            </div>
            <span id="s2-l4">para tus <span style="color: #fcc204">redes sociales.</span></span>
            <div id="s2-tags">
              <div class="s2-tag"><i></i>Instagram</div>
              <div class="s2-tag"><i></i>Facebook</div>
              <div class="s2-tag"><i></i>TikTok</div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // Tiempo local: 0 = 5.85 s del video; DROP = 6.0 s
          const DROP = 0.15;
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#s2-ghost", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 1.2, ease: "power2.out" }, DROP);
          tl.fromTo("#s2-ghost", { xPercent: 0 }, { xPercent: -12, duration: 6.1, ease: "none", immediateRender: false }, DROP);

          tl.fromTo("#s2-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.0);
          tl.fromTo("#s2-l1", { opacity: 0, x: -140 }, { opacity: 1, x: 0, duration: 0.7, ease: "expo.out" }, 0.05);
          // FOTOS golpea en el drop
          tl.fromTo("#s2-l2", { opacity: 0, scale: 1.4, filter: "blur(20px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power4.out" }, DROP);
          // VIDEOS: el bloque amarillo barre y revela la palabra
          tl.fromTo("#s2-l3-fill", { scaleX: 0 }, { scaleX: 1, duration: 0.65, ease: "expo.inOut" }, DROP + 0.9);
          tl.fromTo(
            "#s2-l3-text",
            { clipPath: "inset(0% 100% 0% 0%)", x: -40 },
            { clipPath: "inset(0% 0% 0% 0%)", x: 0, duration: 0.65, ease: "expo.inOut" },
            DROP + 1.0,
          );
          tl.fromTo("#s2-l3", { rotation: -3 }, { rotation: 0, duration: 1.0, ease: "back.out(2)" }, DROP + 0.9);
          tl.fromTo("#s2-l4", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.8, ease: "circ.out" }, DROP + 2.0);
          gsap.utils.toArray("#s2-tags .s2-tag").forEach((tag, i) => {
            tl.fromTo(tag, { opacity: 0, y: 30, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(2)" }, DROP + 3.0 + i * 0.4);
          });
          tl.fromTo("#s2-block", { scale: 1 }, { scale: 1.02, duration: 2.0, ease: "sine.inOut", transformOrigin: "0% 50%" }, 3.9);

          // Salida
          tl.to("#s2-stage", { y: -240, opacity: 0, filter: "blur(20px)", duration: 0.45, ease: "power3.in" }, 5.82);

          window.__timelines["s2-title"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
