<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Escena 5 — Para todas tus redes</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #f4f6fb;
          font-family: "Montserrat", sans-serif;
        }
        #s5-stage {
          position: absolute;
          inset: 0;
        }
        #s5-head {
          position: absolute;
          left: 84px;
          top: 350px;
          width: 912px;
        }
        #s5-kicker {
          display: block;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 32px;
          letter-spacing: 0.16em;
          color: #fcc204;
          margin-bottom: 14px;
          opacity: 0;
        }
        .s5-line {
          display: block;
          font-weight: 900;
          font-size: 72px;
          line-height: 1.04;
          letter-spacing: -0.035em;
          opacity: 0;
        }
        .s5-line em {
          font-style: normal;
          color: #fcc204;
        }
        #s5-note {
          display: block;
          margin-top: 16px;
          font-weight: 700;
          font-size: 34px;
          color: #c3cde6;
          opacity: 0;
        }
        .s5-fmt {
          position: absolute;
          opacity: 0;
        }
        .s5-shot {
          position: absolute;
          left: 0;
          bottom: 120px;
          border-radius: 26px;
          overflow: hidden;
          border: 4px solid rgba(214, 226, 255, 0.2);
          box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55);
        }
        .s5-shot img {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 400px;
          height: 500px;
          margin-left: -200px;
          margin-top: -250px;
          display: block;
        }
        .s5-ratio {
          position: absolute;
          left: 0;
          bottom: 66px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 28px;
          color: #fcc204;
          white-space: nowrap;
        }
        .s5-name {
          position: absolute;
          left: 0;
          bottom: 18px;
          font-weight: 900;
          font-size: 32px;
          white-space: nowrap;
        }
        #s5-chips {
          position: absolute;
          left: 84px;
          top: 1356px;
          width: 912px;
          display: flex;
          gap: 16px;
        }
        .s5-chip {
          height: 66px;
          padding: 0 26px;
          border-radius: 33px;
          background: #fcc204;
          color: #060c1c;
          font-weight: 900;
          font-size: 30px;
          line-height: 66px;
          white-space: nowrap;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="s5-platforms" data-width="1080" data-height="1920">
        <div id="s5-stage">
          <div id="s5-head">
            <span id="s5-kicker">// TODAS LAS PLATAFORMAS</span>
            <span class="s5-line">Para <em>todas</em></span>
            <span class="s5-line">tus redes.</span>
            <span id="s5-note">Cada contenido, en el formato ideal.</span>
          </div>

          <!-- Mismo contenido, tres formatos -->
          <div class="s5-fmt" id="s5-fmt-1" style="left: 84px; top: 640px; width: 280px; height: 680px">
            <div class="s5-shot" style="width: 280px; height: 497px"><img src="assets/scenes/burger.svg" alt="" /></div>
            <div class="s5-ratio">9:16</div>
            <div class="s5-name">Reels · TikTok</div>
          </div>
          <div class="s5-fmt" id="s5-fmt-2" style="left: 392px; top: 640px; width: 300px; height: 680px">
            <div class="s5-shot" style="width: 300px; height: 375px"><img src="assets/scenes/burger-2.svg" alt="" /></div>
            <div class="s5-ratio">4:5</div>
            <div class="s5-name">Publicaciones</div>
          </div>
          <div class="s5-fmt" id="s5-fmt-3" style="left: 720px; top: 640px; width: 276px; height: 680px">
            <div class="s5-shot" style="width: 276px; height: 276px"><img src="assets/scenes/burger-3.svg" alt="" /></div>
            <div class="s5-ratio">1:1</div>
            <div class="s5-name">Anuncios</div>
          </div>

          <div id="s5-chips">
            <div class="s5-chip">Instagram</div>
            <div class="s5-chip">Facebook</div>
            <div class="s5-chip">TikTok</div>
            <div class="s5-chip">YouTube</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // Tiempo local: 0 = 27.85 s del video
          const tl = gsap.timeline({ paused: true });
          const IN = 0.15; // 28.0 s
          const OUT = 5.84;

          tl.fromTo("#s5-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, IN);
          gsap.utils.toArray("#s5-head .s5-line").forEach((el, i) => {
            tl.fromTo(el, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.8, ease: "power4.out" }, IN + 0.15 + i * 0.25);
          });
          tl.fromTo("#s5-note", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, IN + 0.8);

          // Los tres formatos suben uno por uno
          [1, 2, 3].forEach((n, k) => {
            const t = 1.3 + k * 0.5;
            tl.fromTo("#s5-fmt-" + n, { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, t);
            tl.fromTo("#s5-fmt-" + n + " img", { scale: 1.15 }, { scale: 1, duration: 2.4, ease: "sine.out" }, t);
          });
          // Redes
          gsap.utils.toArray("#s5-chips .s5-chip").forEach((c, k) => {
            tl.fromTo(c, { opacity: 0, y: 24, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(2)" }, 3.2 + k * 0.35);
          });

          // Salida
          tl.to("#s5-stage", { y: -240, opacity: 0, filter: "blur(18px)", duration: 0.45, ease: "power3.in" }, OUT);

          window.__timelines["s5-platforms"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
