<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Escena 6 — Mejor imagen, más clientes</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #f4f6fb;
          font-family: "Montserrat", sans-serif;
        }
        #s6-stage {
          position: absolute;
          inset: 0;
        }
        #s6-head {
          position: absolute;
          left: 84px;
          top: 350px;
          width: 912px;
        }
        #s6-kicker {
          display: block;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 32px;
          letter-spacing: 0.16em;
          color: #fcc204;
          margin-bottom: 14px;
          opacity: 0;
        }
        .s6-line {
          display: block;
          font-weight: 900;
          font-size: 72px;
          line-height: 1.04;
          letter-spacing: -0.035em;
          opacity: 0;
        }
        .s6-line em {
          font-style: normal;
          color: #fcc204;
        }
        #s6-card {
          position: absolute;
          left: 212px;
          top: 590px;
          width: 656px;
          height: 756px;
          border-radius: 36px;
          background: #0b1630;
          border: 3px solid rgba(214, 226, 255, 0.16);
          box-shadow: 0 50px 120px rgba(0, 0, 0, 0.55);
          opacity: 0;
        }
        #s6-avatar {
          position: absolute;
          left: 22px;
          top: 20px;
          width: 76px;
          height: 76px;
          border-radius: 50%;
          background: #1b3d6a;
          border: 3px solid #fcc204;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 900;
          font-size: 28px;
          color: #fcc204;
        }
        #s6-user {
          position: absolute;
          left: 118px;
          top: 22px;
          font-weight: 900;
          font-size: 32px;
        }
        #s6-bio {
          position: absolute;
          left: 118px;
          top: 66px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 24px;
          color: #9fb0d6;
        }
        .s6-state {
          position: absolute;
          right: 22px;
          top: 34px;
          height: 46px;
          padding: 0 18px;
          border-radius: 23px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 24px;
          line-height: 46px;
          letter-spacing: 0.1em;
          opacity: 0;
        }
        #s6-state-a {
          background: rgba(214, 226, 255, 0.12);
          color: #c3cde6;
        }
        #s6-state-b {
          background: #fcc204;
          color: #060c1c;
        }
        .s6-tile {
          position: absolute;
          width: 200px;
          height: 200px;
        }
        .s6-face {
          position: absolute;
          inset: 0;
          border-radius: 12px;
          overflow: hidden;
          backface-visibility: hidden;
        }
        .s6-face img {
          position: absolute;
          left: -20px;
          top: -40px;
          width: 240px;
          height: 300px;
          display: block;
        }
        .s6-dull img {
          filter: grayscale(0.85) brightness(0.6) contrast(0.7) blur(1.5px);
        }
        .s6-fresh i {
          position: absolute;
          left: 0;
          bottom: 0;
          width: 100%;
          height: 10px;
          background: #fcc204;
        }
        .s6-fresh {
          opacity: 0;
        }
        #s6-chips {
          position: absolute;
          left: 0;
          top: 1372px;
          width: 1080px;
          display: flex;
          justify-content: center;
          gap: 14px;
        }
        .s6-chip {
          display: flex;
          align-items: center;
          gap: 10px;
          height: 66px;
          padding: 0 22px 0 14px;
          border-radius: 33px;
          background: #13234a;
          border: 2px solid rgba(252, 194, 4, 0.7);
          font-weight: 900;
          font-size: 28px;
          white-space: nowrap;
          opacity: 0;
        }
        .s6-chip svg {
          width: 40px;
          height: 40px;
          display: block;
        }
      </style>

      <div id="root" data-composition-id="s6-impact" data-width="1080" data-height="1920">
        <div id="s6-stage">
          <div id="s6-head">
            <span id="s6-kicker">// EL RESULTADO</span>
            <span class="s6-line">Mejor imagen,</span>
            <span class="s6-line"><em>más clientes.</em></span>
          </div>

          <div id="s6-card">
            <div id="s6-avatar">TN</div>
            <div id="s6-user">tu_negocio</div>
            <div id="s6-bio">Tu perfil en redes</div>
            <div class="s6-state" id="s6-state-a">ANTES</div>
            <div class="s6-state" id="s6-state-b">DESPUÉS</div>
            <div id="s6-grid"></div>
          </div>

          <div id="s6-chips">
            <div class="s6-chip"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#fcc204" /><path d="M20 29 V12 M13 18 L20 11 L27 18" fill="none" stroke="#060c1c" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" /></svg>Más alcance</div>
            <div class="s6-chip"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#fcc204" /><path d="M20 29 V12 M13 18 L20 11 L27 18" fill="none" stroke="#060c1c" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" /></svg>Más interacción</div>
            <div class="s6-chip"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#fcc204" /><path d="M20 29 V12 M13 18 L20 11 L27 18" fill="none" stroke="#060c1c" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" /></svg>Mejor impresión</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // Tiempo local: 0 = 33.85 s del video
          const tl = gsap.timeline({ paused: true });
          const IN = 0.15; // 34.0 s
          const FLIP = 2.4; // 36.25 s
          const OUT = 7.84;
          const IMGS = ["cafe", "burger", "beauty", "burger", "beauty", "cafe", "beauty", "cafe", "burger"];

          const grid = document.getElementById("s6-grid");
          IMGS.forEach((name, i) => {
            const r = Math.floor(i / 3);
            const c = i % 3;
            const tile = document.createElement("div");
            tile.className = "s6-tile";
            tile.id = "s6-tile-" + i;
            tile.style.left = 20 + c * 208 + "px";
            tile.style.top = 120 + r * 208 + "px";
            tile.innerHTML =
              '<div class="s6-face s6-dull"><img src="assets/scenes/' + name + '.svg" alt="" /></div>' +
              '<div class="s6-face s6-fresh"><img src="assets/scenes/' + name + '.svg" alt="" /><i></i></div>';
            grid.appendChild(tile);
          });

          tl.fromTo("#s6-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, IN);
          gsap.utils.toArray("#s6-head .s6-line").forEach((el, i) => {
            tl.fromTo(el, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.8, ease: "power4.out" }, IN + 0.15 + i * 0.3);
          });
          tl.fromTo("#s6-card", { opacity: 0, y: 150, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 1.1, ease: "expo.out" }, 0.6);
          tl.fromTo("#s6-state-a", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 1.4);

          // Cada publicación gira y aparece editada, en diagonal
          IMGS.forEach((_, i) => {
            const r = Math.floor(i / 3);
            const c = i % 3;
            const t = FLIP + (r + c) * 0.22;
            const tile = "#s6-tile-" + i;
            tl.fromTo(tile + " .s6-dull", { rotationY: 0, transformPerspective: 800 }, { rotationY: 90, transformPerspective: 800, duration: 0.25, ease: "power1.in" }, t);
            tl.fromTo(tile + " .s6-fresh", { opacity: 0, rotationY: -90, transformPerspective: 800 }, { opacity: 1, rotationY: 0, transformPerspective: 800, duration: 0.3, ease: "power2.out" }, t + 0.25);
          });
          const DONE = FLIP + 4 * 0.22 + 0.55;
          tl.to("#s6-state-a", { opacity: 0, duration: 0.25, ease: "power1.in" }, DONE - 0.3);
          tl.fromTo("#s6-state-b", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.2)" }, DONE - 0.1);
          tl.fromTo("#s6-card", { boxShadow: "0 50px 120px rgba(0,0,0,0.55)" }, { boxShadow: "0 50px 120px rgba(0,0,0,0.55), 0 0 80px 6px rgba(252,194,4,0.35)", duration: 0.6, ease: "power2.out", immediateRender: false }, DONE);

          // Beneficios
          gsap.utils.toArray("#s6-chips .s6-chip").forEach((c, k) => {
            tl.fromTo(c, { opacity: 0, y: 30, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(2)" }, 4.9 + k * 0.45);
          });

          // Salida
          tl.to("#s6-stage", { y: -240, opacity: 0, filter: "blur(18px)", duration: 0.45, ease: "power3.in" }, OUT);

          window.__timelines["s6-impact"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
