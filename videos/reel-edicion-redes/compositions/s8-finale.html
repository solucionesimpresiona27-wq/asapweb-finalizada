<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Escena 8 — La idea se enciende (cierre con logo)</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
        }
        /* Destello de la bombilla al encenderse (centro de la bombilla del logo final) */
        #s8-flash {
          position: absolute;
          left: -263px;
          top: 398px;
          width: 900px;
          height: 900px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(255, 249, 225, 1) 0%, rgba(252, 194, 4, 0.75) 22%, rgba(252, 194, 4, 0) 66%);
          opacity: 0;
        }
        /* La luz llena la pantalla desde la bombilla */
        #s8-light {
          position: absolute;
          inset: 0;
          background: #fbf7ec;
          clip-path: circle(0px at 188px 848px);
        }
        #s8-cam {
          position: absolute;
          inset: 0;
          transform-origin: 540px 960px;
        }
        #s8-warm {
          position: absolute;
          left: -310px;
          top: 250px;
          width: 1700px;
          height: 1300px;
          border-radius: 50%;
          background: radial-gradient(ellipse, rgba(252, 194, 4, 0.26) 0%, rgba(252, 194, 4, 0.08) 42%, rgba(252, 194, 4, 0) 70%);
        }
        #s8-grid {
          position: absolute;
          inset: 0;
          background-image: radial-gradient(circle, rgba(27, 61, 106, 0.16) 2px, transparent 2.6px);
          background-size: 48px 48px;
          -webkit-mask-image: radial-gradient(ellipse 60% 45% at 50% 47%, transparent 30%, #000 60%, transparent 90%);
          mask-image: radial-gradient(ellipse 60% 45% at 50% 47%, transparent 30%, #000 60%, transparent 90%);
        }
        #s8-rings {
          position: absolute;
          left: -160px;
          top: 200px;
          width: 1400px;
          height: 1400px;
        }
        #s8-rings svg {
          width: 100%;
          height: 100%;
          display: block;
        }
        #s8-tag {
          position: absolute;
          left: 0;
          top: 1118px;
          width: 1080px;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        #s8-rule {
          width: 150px;
          height: 9px;
          border-radius: 5px;
          background: #fcc204;
          transform-origin: 50% 50%;
        }
        #s8-tagline {
          margin-top: 30px;
          font-weight: 700;
          font-size: 52px;
          letter-spacing: -0.015em;
          color: #1b3d6a;
          white-space: nowrap;
        }
        #s8-tagline em {
          font-style: normal;
          font-weight: 900;
        }
      </style>

      <div id="root" data-composition-id="s8-finale" data-width="1080" data-height="1920">
        <div id="s8-light">
          <div id="s8-cam">
            <div id="s8-warm"></div>
            <div id="s8-grid"></div>
            <div id="s8-rings">
              <svg viewBox="0 0 1400 1400" aria-hidden="true">
                <circle id="s8-ring-1" cx="700" cy="700" r="560" fill="none" stroke="rgba(27,61,106,0.16)" stroke-width="3" stroke-dasharray="3519" stroke-dashoffset="3519" transform="rotate(-90 700 700)" />
                <circle id="s8-ring-2" cx="700" cy="700" r="660" fill="none" stroke="rgba(252,194,4,0.55)" stroke-width="3" stroke-dasharray="4147" stroke-dashoffset="4147" transform="rotate(90 700 700)" />
              </svg>
            </div>
            <div id="s8-tag">
              <div id="s8-rule"></div>
              <div id="s8-tagline">Fotos y videos que <em>impresionan</em></div>
            </div>
          </div>
        </div>
        <div id="s8-flash"></div>
      </div>

      <script>
        (function () {
          // Tiempo local: 0 = 47.9 s del video; HIT = 48.0 s (golpe final)
          const tl = gsap.timeline({ paused: true });
          const HIT = 0.1;

          // La bombilla se enciende: destello y la luz cubre la pantalla
          tl.fromTo("#s8-flash", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" }, HIT - 0.04);
          tl.to("#s8-flash", { opacity: 0, scale: 1.6, duration: 0.7, ease: "power2.out" }, HIT + 0.16);
          tl.fromTo(
            "#s8-light",
            { clipPath: "circle(0px at 188px 848px)" },
            { clipPath: "circle(2300px at 188px 848px)", duration: 0.75, ease: "power3.out" },
            HIT,
          );

          // Detalles del fondo claro
          tl.fromTo("#s8-warm", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.4, ease: "power2.out" }, HIT + 0.1);
          tl.to("#s8-warm", { scale: 1.08, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, HIT + 1.5);
          tl.fromTo("#s8-grid", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power1.out" }, HIT + 0.3);
          tl.fromTo("#s8-ring-1", { strokeDashoffset: 3519 }, { strokeDashoffset: 0, duration: 1.4, ease: "power3.inOut" }, HIT + 0.25);
          tl.fromTo("#s8-ring-2", { strokeDashoffset: 4147 }, { strokeDashoffset: 0, duration: 1.6, ease: "power3.inOut" }, HIT + 0.4);
          tl.fromTo("#s8-rings", { rotation: -8 }, { rotation: 10, duration: 4.9, ease: "none", transformOrigin: "50% 50%" }, HIT);

          // Lema bajo el logo
          tl.fromTo("#s8-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "expo.out" }, HIT + 0.65);
          tl.fromTo(
            "#s8-tagline",
            { opacity: 0, y: 40, clipPath: "inset(0% 0% 100% 0%)" },
            { opacity: 1, y: 0, clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power3.out" },
            HIT + 0.75,
          );

          // Mismo empuje de cámara que el logo (brand.html)
          tl.fromTo("#s8-cam", { scale: 1 }, { scale: 1.045, duration: 5.1 - (HIT + 0.4), ease: "sine.out" }, HIT + 0.4);

          window.__timelines["s8-finale"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
