          const DESIGN = 2.65; // 10.5 s
          const CLICK = 4.35; // 12.2 s
          const LAUNCH = 5.0; // 12.85 s
          const PHONE = 6.43; // 14.28 s
          const OUT = 7.84; // 15.69 s

          tl.fromTo("#s3-steps", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, IN);
          tl.fromTo("#s3-seg-1", { scaleX: 0 }, { scaleX: 1, duration: DESIGN - IN, ease: "none" }, IN);
          tl.to("#s3-label-1", { opacity: 0, y: -80, duration: 0.35, ease: "power3.in" }, DESIGN - 0.2);
          tl.fromTo("#s3-label-2", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, DESIGN + 0.05);
          tl.fromTo("#s3-seg-2", { scaleX: 0 }, { scaleX: 1, duration: LAUNCH - DESIGN, ease: "none" }, DESIGN);
          tl.to("#s3-label-2", { opacity: 0, y: -80, duration: 0.35, ease: "power3.in" }, LAUNCH - 0.2);
          tl.fromTo("#s3-label-3", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, LAUNCH + 0.05);
          tl.fromTo("#s3-seg-3", { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power2.out" }, LAUNCH);

          // ---- 01 Diseñamos: el navegador llega y el boceto se arma
          tl.fromTo(
            "#s3-browser",
            { opacity: 0, y: 140, scale: 0.9, rotationX: 18, transformPerspective: 1800 },
            { opacity: 1, y: 0, scale: 1, rotationX: 0, transformPerspective: 1800, duration: 0.8, ease: "expo.out" },
            IN,
          );
          const wires = gsap.utils.toArray("#s3-wire .s3-w");
          const groupAt = (el) =>
            el.classList.contains("s3-w-c") ? 1.45 : el.classList.contains("s3-w-b") ? 1.1 : 0.75;
          wires.forEach((el, i) => {
            tl.fromTo(
              el,
              { opacity: 0, scale: 0.7, y: 18 },
              { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "back.out(2)" },
              groupAt(el) + (i % 5) * 0.04,
            );
          });

          // ---- 02 Desarrollamos: la línea de escaneo convierte el boceto en diseño
          const SCAN = 0.95;
          tl.fromTo("#s3-scan", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, DESIGN);
          tl.fromTo("#s3-scan", { y: 0 }, { y: 712, duration: SCAN, ease: "power2.inOut", immediateRender: false }, DESIGN);
          tl.fromTo(
            "#s3-design",
            { clipPath: "inset(0% 0% 100% 0%)" },
            { clipPath: "inset(0% 0% 0% 0%)", duration: SCAN, ease: "power2.inOut" },
            DESIGN,
          );
          tl.fromTo(
            "#s3-wire",
            { clipPath: "inset(0% 0% 0% 0%)" },
            { clipPath: "inset(100% 0% 0% 0%)", duration: SCAN, ease: "power2.inOut" },
            DESIGN,
          );
          tl.to("#s3-scan", { opacity: 0, duration: 0.15, ease: "none" }, DESIGN + SCAN - 0.05);
          // destello del navegador al terminar
          tl.fromTo(
            "#s3-browser",
            { boxShadow: "0 50px 120px rgba(0,0,0,0.55), 0 0 0 1px rgba(61,107,255,0.15)" },
            {
              boxShadow: "0 50px 120px rgba(0,0,0,0.55), 0 0 90px 10px rgba(252,194,4,0.35)",
              duration: 0.3,
              ease: "power2.out",
              yoyo: true,
              repeat: 1,
              immediateRender: false,
            },
            DESIGN + SCAN - 0.1,
          );

          // ---- Clic en "Contáctanos" → llega un cliente
          const BTN_X = 60 + 3 + 40 + 135; // centro del botón en el escenario
          const BTN_Y = 540 + 3 + 78 + 400 + 38;
          tl.fromTo(
            "#s3-cursor",
            { x: 1120, y: 1560, opacity: 1 },
            { x: BTN_X - 20, y: BTN_Y - 14, duration: 0.6, ease: "power3.out" },
            CLICK - 0.62,
          );
          tl.fromTo("#s3-cursor", { scale: 1 }, { scale: 0.86, duration: 0.08, ease: "power2.in", immediateRender: false }, CLICK);
          tl.to("#s3-cursor", { scale: 1, duration: 0.3, ease: "back.out(3)" }, CLICK + 0.08);
          tl.fromTo("#s3-d-btn", { scale: 1 }, { scale: 0.92, duration: 0.08, ease: "power2.in", immediateRender: false }, CLICK);
          tl.to("#s3-d-btn", { scale: 1, duration: 0.4, ease: "back.out(3)" }, CLICK + 0.08);
          tl.set([".s3-ripple"], { x: BTN_X - 136, y: BTN_Y - 1061 }, 0);
          tl.fromTo("#s3-ripple-1", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 3.2, duration: 0.7, ease: "power2.out", immediateRender: false }, CLICK);
          tl.fromTo("#s3-ripple-2", { opacity: 0.7, scale: 0.4 }, { opacity: 0, scale: 2.2, duration: 0.6, ease: "power2.out", immediateRender: false }, CLICK + 0.1);
          tl.to("#s3-cursor", { x: 1160, y: 1700, duration: 0.5, ease: "power3.in" }, CLICK + 0.5);
          tl.fromTo(
            "#s3-toast",
            { opacity: 0, y: 60, scale: 0.85 },
            { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" },
            CLICK + 0.22,
          );
          tl.to("#s3-toast", { opacity: 0, y: 40, scale: 0.92, duration: 0.3, ease: "power2.in" }, LAUNCH + 0.9);

          // ---- 03 Lanzamos: se escribe la dirección y queda en línea
          const URL = "www.tunegocio.com";
          const urlEl = document.getElementById("s3-url-text");
          [...URL].forEach((ch, i) => {
            const s = document.createElement("span");
            s.textContent = ch;
            urlEl.appendChild(s);
            tl.set(s, { opacity: 1 }, LAUNCH + 0.13 + i * 0.04);
          });
          tl.fromTo("#s3-online", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.6)" }, LAUNCH + 1.0);
          tl.fromTo("#s3-online i", { scale: 1 }, { scale: 1.5, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, LAUNCH + 1.4);

          // ---- El navegador gira y entra el celular (también se ve perfecto ahí)
          tl.to(
            "#s3-browser",
            { x: -118, y: -30, scale: 0.74, rotationY: 18, transformPerspective: 1800, duration: 0.8, ease: "expo.inOut" },
            PHONE - 0.1,
          );
          tl.fromTo(
            "#s3-phone",
            { opacity: 0, x: 520, rotation: 14, y: 80 },
            { opacity: 1, x: 0, rotation: -3, y: 0, duration: 0.85, ease: "expo.out" },
            PHONE,
          );
          tl.to("#s3-phone", { y: -16, rotation: -2, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, PHONE + 0.85);

          // ---- Salida: desenfoque de paso
          tl.to("#s3-stage", { scale: 0.94, opacity: 0, filter: "blur(24px)", duration: 0.42, ease: "power2.in" }, OUT);

          window.__timelines["s3-build"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
