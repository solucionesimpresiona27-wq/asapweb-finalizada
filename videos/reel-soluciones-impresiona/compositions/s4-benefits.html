      <script>
        (function () {
          // Tiempo local: 0 = 15.85 s del video
          const tl = gsap.timeline({ paused: true });
          const IN = 0.15; // 16.0 s
          const ROWS = [1.15, 2.15, 3.15, 4.15]; // 17, 18, 19, 20 s (en el compás)
          const TOPS = [700, 874, 1048, 1222];
          const OUT = 5.83; // 21.68 s

          tl.fromTo("#s4-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, IN);
          gsap.utils.toArray("#s4-title .s4-word").forEach((w, i) => {
            tl.fromTo(
              w,
              { opacity: 0, y: 70, rotation: 4 },
              { opacity: 1, y: 0, rotation: 0, duration: 0.55, ease: "power4.out" },
              IN + 0.08 + i * 0.07,
            );
          });

          ROWS.forEach((t, i) => {
            const row = "#s4-row-" + (i + 1);
            tl.fromTo(row, { opacity: 0, x: 180 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, t);
            tl.fromTo(
              row + " .s4-icon",
              { scale: 0, rotation: -25 },
              { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.4)" },
              t + 0.08,
            );
            tl.fromTo(
              row + " .s4-tick",
              { strokeDashoffset: 44 },
              { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
              t + 0.32,
            );
            tl.fromTo(row + " .s4-check", { scale: 0.6 }, { scale: 1, duration: 0.45, ease: "back.out(3)" }, t + 0.3);
            // El marco amarillo salta a la fila nueva
            if (i === 0) {
              tl.fromTo("#s4-focus", { opacity: 0, y: TOPS[0] - 8, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, t + 0.05);
            } else {
              tl.to("#s4-focus", { y: TOPS[i] - 8, duration: 0.45, ease: "expo.inOut" }, t - 0.05);
            }
          });
          // Todo listo: el marco se abre y desaparece
          tl.to("#s4-focus", { opacity: 0, scale: 1.04, duration: 0.5, ease: "power2.out" }, 5.0);

          // Salida: empuje hacia arriba
          tl.to("#s4-stage", { y: -300, opacity: 0, filter: "blur(16px)", duration: 0.42, ease: "power3.in" }, OUT);

          window.__timelines["s4-benefits"] = tl;
